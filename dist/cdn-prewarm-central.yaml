                  "Boston, MA": ["BOS50-P5", "BOS50-P6", "BOS50-P8"],
                  "Chicago, IL": ["ORD56-P4", "ORD56-P15", "ORD58-P7", "ORD58-P14"],
                  "Columbus, OH": ["CMH51-P1", "CMH68-P2"],
                  "Dallas/Fort Worth, TX": ["DFW56-P7", "DFW57-P2", "DFW57-P6"],
                  "Denver, CO": ["DEN52-P1", "DEN53-P6"],
                  "Hillsboro, OR": ["HIO52-P1", "HIO52-P3", "HIO52-P4"],
                  "Houston, TX": ["IAH51-P2", "IAH51-P3"],
                  "Kansas City, MO": ["MCI50-P2", "MCI50-P3", "MCI50-P4"],
                  "Los Angeles, CA": ["LAX53-P1", "LAX54-P9", "LAX54-P11"],
                  "Miami, FL": ["MIA3-P2", "MIA3-P5", "MIA3-P7", "MIA50-P6"],
                  "Minneapolis, MN": ["MSP50-P1", "MSP50-P3", "MSP50-P6"],
                  "Nashville, TN": ["BNA50-P1", "BNA50-P2"],
                  "New York, NY": ["JFK50-P6", "JFK50-P7", "JFK50-P9", "JFK50-P12", "JFK52-P8"],
                  "Philadelphia, PA": ["PHL51-P1", "PHL51-P3", "PHL51-P4"],
                  "Phoenix, AZ": ["PHX50-P2"],
                  "Pittsburgh, PA": ["PIT50-P1"],
                  "Salt Lake City, UT": ["SLC52-P1", "SLC52-P2"],
                  "San Francisco, CA": ["SFO5-P1", "SFO53-P1", "SFO53-P2", "SFO53-P9", "SFO53-P12"],
                  "Seattle, WA": ["SEA73-P1", "SEA900-P5", "SEA900-P6", "SEA900-P9", "SEA900-P10"],
                  "Tampa, FL": ["TPA52-P1", "TPA52-P4"],
                  "Washington D. C.": ["IAD55-P10", "IAD89-P3"],
              },
              "Vietnam": {"Hanoi": ["HAN50-P3", "HAN51-P1", "HAN51-P2"], "Ho Chi Minh City": ["SGN50-P3", "SGN50-P4"]},
          }
          # END EDGE SNAPSHOT

          _cloudfront = boto3.client("cloudfront")
          _ssl_context = ssl.create_default_context()
          _edge_cache = {"fetched_at": 0.0, "data": None}
          _distribution_cache = {"fetched_at": 0.0, "by_name": {}}


          def _log(message, **fields):
              # With the function's JSON log format, the fields become top-level keys for Logs Insights.
              logger.info(message, extra={"type": message, **fields})


          def _env_list(name):
              items = [item.strip() for item in os.environ.get(name, "").split(";") if item.strip()]
              if not items:
                  raise ValueError(f"environment variable {name} is empty")
              return items


          def file_patterns():
              """FILE_PATTERNS as lower-case glob patterns; unset or empty means every file."""
              patterns = [p.strip().lower() for p in os.environ.get("FILE_PATTERNS", "*").split(";") if p.strip()]
              return patterns or ["*"]


          def matches_file_patterns(key, patterns):
              """Match the file name (part after the last '/') against the patterns, ignoring case."""
              name = key.rsplit("/", 1)[-1].lower()
              return any(fnmatch.fnmatchcase(name, pattern) for pattern in patterns)


          def load_routes():
              paths = _env_list("S3_PATHS")
              url_prefixes = _env_list("CDN_URL_PREFIXES")
              if len(paths) != len(url_prefixes):
                  raise ValueError("S3_PATHS and CDN_URL_PREFIXES must have the same number of entries, "
                                   f"got {len(paths)} and {len(url_prefixes)}")
              routes = []
              for path, url_prefix in zip(paths, url_prefixes, strict=True):
                  bucket, _, key_prefix = path.removeprefix("s3://").partition("/")
                  if not bucket:
                      raise ValueError(f"invalid S3 path: {path!r}")
                  # A path is a folder: "static" means "static/", never "static-old/".
                  if key_prefix and not key_prefix.endswith("/"):
                      key_prefix += "/"

                  url = urllib.parse.urlsplit(url_prefix)
                  if url.scheme not in ("http", "https") or not url.hostname:
                      raise ValueError(f"invalid CDN URL prefix: {url_prefix!r}")
                  base_path = url.path if url.path.endswith("/") else url.path + "/"

                  routes.append({
                      "bucket": bucket,
                      "key_prefix": key_prefix,
                      "scheme": url.scheme,
                      "host": url.hostname.lower(),
                      "port": url.port or (443 if url.scheme == "https" else 80),
                      "base_path": base_path,
                  })
              return routes


          def _nodes_by_location(data):
              """Reduce the edge list JSON to {country: {city: [node codes]}}."""
              locations = {}
              for location in data["edge_locations"]:
                  country = str(location.get("country", "")).strip()
                  city = str(location.get("city", "")).strip()
                  codes = locations.setdefault(country, {}).setdefault(city, [])
                  for node in location.get("active_nodes") or []:
                      code = str(node.get("code", "")).upper()
                      if NODE_CODE_RE.match(code) and code not in codes:
                          codes.append(code)
              if not any(codes for cities in locations.values() for codes in cities.values()):
                  raise ValueError("edge list contains no nodes")
              return locations


          def _normalize_name(name):
              """Ignore case, accents and punctuation: "Montréal, QC" -> "montrealqc"."""
              text = unicodedata.normalize("NFKD", str(name))
              return "".join(ch for ch in text if ch.isalnum()).casefold()


          def _city_names(city):
              """Accepted spellings of a city: "Dallas/Fort Worth, TX" also matches
              "Dallas/Fort Worth", "Dallas" and "Fort Worth"; "Taipei, TW" also matches "Taipei"."""
              head = city.split(",")[0]
              return {_normalize_name(name) for name in (city, head, *head.split("/")) if name.strip()}


          def _edge_list():
              """Return ({country: {city: [node codes]}}, source).

              Order of preference: the list fetched from EDGE_LOCATIONS_URL in the last hour,
              a fresh fetch, the last list fetched successfully, the snapshot bundled in this file.
              """
              now = time.time()
              cached = _edge_cache["data"]
              if cached is not None and now - _edge_cache["fetched_at"] < EDGE_LIST_TTL_SECONDS:
                  return cached, "url"
              url = os.environ.get("EDGE_LOCATIONS_URL") or DEFAULT_EDGE_LOCATIONS_URL
              if not url.startswith("https://"):
                  raise ValueError("EDGE_LOCATIONS_URL must be an https URL")
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": USER_AGENT})
                  with urllib.request.urlopen(request, timeout=10) as response:
                      data = _nodes_by_location(json.loads(response.read()))
              except Exception as exc:
                  if cached is not None:
                      fetched = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(_edge_cache["fetched_at"]))
                      logger.warning("edge list fetch failed (%s), using the list fetched at %s", exc, fetched)
                      return cached, f"url, fetched {fetched}"
                  logger.warning("edge list fetch failed (%s), using the bundled snapshot from %s", exc, EDGE_SNAPSHOT_DATE)
                  return EDGE_SNAPSHOT, f"snapshot {EDGE_SNAPSHOT_DATE}"
              _edge_cache.update(fetched_at=now, data=data)
              return data, "url"


          def edge_nodes(names):
              """Resolve country and/or city names, in any mix, to edge nodes.

              A name matching a country selects every node in it; a name matching a city
              selects that city's nodes. Returns ([node codes], {name: node count}, source).
              """
              locations, source = _edge_list()
              nodes, matched = [], {}
              for name in names:
                  wanted = _normalize_name(name)
                  found = []
                  for country, cities in locations.items():
                      whole_country = _normalize_name(country) == wanted
                      for city, codes in cities.items():
                          if whole_country or wanted in _city_names(city):
                              found.extend(codes)
                  matched[name] = len(dict.fromkeys(found))
                  for code in found:
                      if code not in nodes:
                          nodes.append(code)
              missing = [name for name, count in matched.items() if not count]
              if missing:
                  logger.warning("no edge nodes for %s in the edge list (%s)", missing, source)
              if not nodes:
                  raise ValueError(f"no edge nodes found for EDGE_COUNTRIES_OR_CITIES={';'.join(names)} ({source})")
              return nodes, matched, source


          def _load_distributions():
              by_name = {}
              for page in _cloudfront.get_paginator("list_distributions").paginate():
                  for dist in page["DistributionList"].get("Items", []):
                      match = CF_DOMAIN_RE.match(dist["DomainName"].lower())
                      if not match:
                          continue
                      info = {"id": dist["Id"], "label": match.group(1)}
                      by_name[match.group(0)] = info
                      for alias in (dist.get("Aliases") or {}).get("Items", []):
                          by_name[alias.lower()] = info
              _distribution_cache.update(fetched_at=time.time(), by_name=by_name)


          def _match_distribution(host):
              by_name = _distribution_cache["by_name"]
              if host in by_name:
                  return by_name[host]
              # A wildcard alternate domain name covers one label: *.example.com serves cdn.example.com.
              _, dot, parent = host.partition(".")
              return by_name.get(f"*.{parent}") if dot else None


          def distribution_for(host):
              """Return {"id", "label"} of the distribution in this account that serves host."""
              fresh = time.time() - _distribution_cache["fetched_at"] < DISTRIBUTION_LIST_TTL_SECONDS
              if not fresh:
                  _load_distributions()
              dist = _match_distribution(host)
              if dist is None and fresh:
                  _load_distributions()  # the domain may have been added after the last load
                  dist = _match_distribution(host)
              if dist is None:
                  raise ValueError(f"no CloudFront distribution in this account serves {host}; check CDN_URL_PREFIXES")
              return dist


          def invalidate_and_wait(dist_id, paths, caller_reference, context):
              invalidation = _cloudfront.create_invalidation(
                  DistributionId=dist_id,
                  InvalidationBatch={
                      "Paths": {"Quantity": len(paths), "Items": paths},
                      "CallerReference": caller_reference,
                  },
              )["Invalidation"]
              started = time.monotonic()
              _log("invalidation_created", distribution=dist_id, invalidation=invalidation["Id"], paths=paths)
              # Leave enough time to prewarm after the wait.
              max_wait = min(INVALIDATION_MAX_WAIT_SECONDS, context.get_remaining_time_in_millis() / 1000 / 2)
              while invalidation["Status"] != "Completed":
                  if time.monotonic() - started > max_wait:
                      raise TimeoutError(f"invalidation {invalidation['Id']} on {dist_id} did not complete in {int(max_wait)}s")
                  time.sleep(INVALIDATION_POLL_SECONDS)
                  invalidation = _cloudfront.get_invalidation(DistributionId=dist_id, Id=invalidation["Id"])["Invalidation"]
              _log("invalidation_completed", distribution=dist_id, invalidation=invalidation["Id"],
                   seconds=round(time.monotonic() - started, 1))


          def _connection(target, ip):
              if target["scheme"] == "https":
                  conn = http.client.HTTPSConnection(target["host"], target["port"], timeout=CONNECT_TIMEOUT, context=_ssl_context)
              else:
                  conn = http.client.HTTPConnection(target["host"], target["port"], timeout=CONNECT_TIMEOUT)
              # Connect to the chosen edge IP while keeping Host and TLS SNI set to the site's domain.
              conn._create_connection = lambda address, timeout, source=None: socket.create_connection(
                  (ip, address[1]), timeout, source)
              return conn


          class _NodeError(Exception):
              """An expected per-node failure; the message is logged as is."""


          class _OutOfTime(Exception):
              """The Lambda is about to time out."""


          def _read_timeout(deadline):
              left = deadline - time.monotonic() - ABORT_SECONDS
              if left <= 0:
                  raise _OutOfTime(f"aborted with less than {ABORT_SECONDS}s of Lambda time left")
              return min(READ_TIMEOUT, left)


          def _fetch(target, node, deadline, result):
              edge_host = f"{target['cf_label']}.{node}.cloudfront.net"
              try:
                  infos = socket.getaddrinfo(edge_host, target["port"], socket.AF_INET, socket.SOCK_STREAM)
              except OSError as exc:
                  raise _NodeError(f"dns {edge_host}: {exc}") from exc
              ips = list(dict.fromkeys(info[4][0] for info in infos))
              conn = None
              try:
                  # A node has several IPs; if one cannot be reached, try the next.
                  for attempt, ip in enumerate(ips, 1):
                      result["ip"] = ip
                      conn = _connection(target, ip)
                      try:
                          conn.connect()
                          break
                      except OSError:
                          conn.close()
                          if attempt == len(ips):
                              raise
                  conn.sock.settimeout(_read_timeout(deadline))
                  conn.request("GET", target["path"], headers={"Accept-Encoding": ACCEPT_ENCODING, "User-Agent": USER_AGENT})
                  response = conn.getresponse()
                  result.update(status=response.status, pop=response.getheader("x-amz-cf-pop"),
                                x_cache=response.getheader("x-cache"), bytes=0)
                  # Read the whole body so the edge caches the complete object.
                  while True:
                      conn.sock.settimeout(_read_timeout(deadline))
                      # Small reads keep the time-limit check responsive on slow connections.
                      chunk = response.read(64 * 1024)
                      if not chunk:
                          break
                      result["bytes"] += len(chunk)
                  etag = (response.getheader("etag") or "").removeprefix("W/").strip('"')
                  result["etag_match"] = (etag == target["etag"]) if target["etag"] else None
              finally:
                  if conn is not None:
                      conn.close()
              if not 200 <= result["status"] < 300:
                  raise _NodeError(f"http {result['status']}")
              if result["pop"] != node:
                  raise _NodeError(f"served by {result['pop']}, not {node}")


          def warm(target, node, deadline):
              """Fetch the target once from one edge node. Never raises; the outcome is in the result:
              ok, failed, not_started (too little Lambda time left) or aborted (cut off by the time limit)."""
              result = {"url": target["url"], "node": node, "ok": False}
              started = time.monotonic()
              if deadline - started < STOP_STARTING_SECONDS:
                  result.update(outcome="not_started", error=f"less than {STOP_STARTING_SECONDS}s of Lambda time left", ms=0)
                  return result
              try:
                  _fetch(target, node, deadline, result)
                  result.update(ok=True, outcome="ok")
              except _OutOfTime as exc:
                  result.update(outcome="aborted", error=str(exc))
              except _NodeError as exc:
                  result.update(outcome="failed", error=str(exc))
              except Exception as exc:
                  if isinstance(exc, TimeoutError) and deadline - time.monotonic() <= ABORT_SECONDS + 1:
                      # The read timeout was shortened to the time budget and has run out.
                      result.update(outcome="aborted", error=f"aborted with less than {ABORT_SECONDS}s of Lambda time left")
                  else:
                      result.update(outcome="failed", error=f"{type(exc).__name__}: {exc}")
              result["ms"] = int((time.monotonic() - started) * 1000)
              return result


          def _targets(routes, bucket, key, etag):
              """Return (targets, skipped URLs). A matching route whose distribution cannot be found
              is skipped; the other routes still run."""
              targets, skipped = [], []
              for route in routes:
                  if route["bucket"] != bucket or not key.startswith(route["key_prefix"]):
                      continue
                  path = route["base_path"] + urllib.parse.quote(key[len(route["key_prefix"]):], safe="/")
                  default_port = 443 if route["scheme"] == "https" else 80
                  netloc = route["host"] if route["port"] == default_port else f"{route['host']}:{route['port']}"
                  url = f"{route['scheme']}://{netloc}{path}"
                  try:
                      dist = distribution_for(route["host"])
                  except Exception as exc:
                      logger.error("skip %s for s3://%s/%s: %s", url, bucket, key, exc)
                      skipped.append(url)
                      continue
                  targets.append({**route, "path": path, "etag": etag, "url": url,
                                  "dist_id": dist["id"], "cf_label": dist["label"]})
              return targets, skipped


          def handler(event, context):
              routes = load_routes()
              edge_names = _env_list("EDGE_COUNTRIES_OR_CITIES")
              invalidate = os.environ.get("INVALIDATE_BEFORE_PREWARM", "true").strip().lower() != "false"

              detail = event.get("detail") or {}
              bucket = (detail.get("bucket") or {}).get("name")
              obj = detail.get("object") or {}
              key = obj.get("key")
              if event.get("detail-type") != "Object Created" or not bucket or not key:
                  logger.warning("ignored event: %s", json.dumps(event)[:2000])
                  return {"status": "ignored"}
              if key.endswith("/"):
                  logger.info("skip folder marker s3://%s/%s", bucket, key)
                  return {"status": "skipped"}
              patterns = file_patterns()
              if not matches_file_patterns(key, patterns):
                  logger.info("skip s3://%s/%s: file name does not match FILE_PATTERNS=%s", bucket, key, ";".join(patterns))
                  return {"status": "skipped"}

              targets, skipped_urls = _targets(routes, bucket, key, obj.get("etag"))
              if not targets:
                  if skipped_urls:
                      raise RuntimeError(f"no CloudFront distribution found for any URL of s3://{bucket}/{key}: {skipped_urls}")
                  logger.info("no configured path matches s3://%s/%s", bucket, key)
                  return {"status": "skipped"}

              nodes, nodes_per_name, edge_list_source = edge_nodes(edge_names)
              _log("prewarm_start", object=f"s3://{bucket}/{key}", urls=[t["url"] for t in targets],
                   skipped_urls=skipped_urls, distributions=sorted({t["dist_id"] for t in targets}), nodes=len(nodes),
                   nodes_per_name=nodes_per_name, edge_list=edge_list_source, invalidate=invalidate)

              if invalidate:
                  by_distribution = {}
                  for target in targets:
                      by_distribution.setdefault(target["dist_id"], set()).add(target["path"])
                  for dist_id, paths in by_distribution.items():
                      # The event id keeps retries of the same event idempotent.
                      invalidate_and_wait(dist_id, sorted(paths), f"{event.get('id', context.aws_request_id)}-{dist_id}", context)

              deadline = time.monotonic() + context.get_remaining_time_in_millis() / 1000
              jobs = [(target, node) for target in targets for node in nodes]
              results = []
              with concurrent.futures.ThreadPoolExecutor(max_workers=min(CONCURRENCY, len(jobs))) as pool:
                  futures = [pool.submit(warm, target, node, deadline) for target, node in jobs]
                  # Log each node as soon as it finishes, so results survive even a hard timeout.
                  for future in concurrent.futures.as_completed(futures):
                      result = future.result()
                      _log("prewarm_result", **result)
                      results.append(result)

              def nodes_with(outcome):
                  return sorted({r["node"] for r in results if r["outcome"] == outcome})

              counts = {o: sum(r["outcome"] == o for r in results) for o in ("ok", "failed", "not_started", "aborted")}
              summary = {"object": f"s3://{bucket}/{key}", "requests": len(results), "succeeded": counts["ok"],
                         "failed": counts["failed"], "not_started": counts["not_started"], "aborted": counts["aborted"],
                         "failed_nodes": nodes_with("failed"),
                         "unfinished_nodes": sorted(set(nodes_with("not_started")) | set(nodes_with("aborted"))),
                         "skipped_urls": skipped_urls}
              _log("prewarm_summary", **summary)
              if counts["not_started"] or counts["aborted"]:
                  logger.warning("Lambda time limit: %d requests not started, %d aborted for s3://%s/%s",
                                 counts["not_started"], counts["aborted"], bucket, key)
              # Retry only real failures; a retry would hit the same time limit again.
              if counts["ok"] == 0 and counts["failed"]:
                  raise RuntimeError(f"no prewarm request succeeded for s3://{bucket}/{key}")
              return summary

  # No dead-letter queue: a failed invocation is retried twice by Lambda (asynchronous
  # invocation default), then dropped. Every failure is in the log group.
  PrewarmRule:
    Type: AWS::Events::Rule
    Properties:
      Description: S3 Object Created events forwarded from every region.
      EventBusName: !Ref EventBus
      EventPattern:
        source: [aws.s3]
        detail-type: [Object Created]
      Targets:
        - Id: prewarm-lambda
          Arn: !GetAtt PrewarmFunction.Arn

  PrewarmInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PrewarmFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt PrewarmRule.Arn

Outputs:
  EventBusArn:
    Description: Pass this to the forwarder stack in every region that has watched buckets.
    Value: !GetAtt EventBus.Arn
  PrewarmFunctionName:
    Value: !Ref PrewarmFunction
  LogGroupName:
    Value: !Ref PrewarmLogGroup
